name: 予想と結果の更新
on:
  # 定期実行は live.yml（常駐）に統合
  workflow_dispatch:
    inputs:
      date: { description: "対象日 YYYYMMDD（空欄で今日）", required: false }
      force: { description: "予想を作り直す (yes/no)", required: false, default: "no" }
permissions:
  contents: write
concurrency: { group: update, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: 予想・オッズ・結果
        env: { TZ: Asia/Tokyo }
        run: |
          D="${{ github.event.inputs.date }}"; [ -z "$D" ] && D=$(date +%Y%m%d)
          F=""; [ "${{ github.event.inputs.force }}" = "yes" ] && F="--force"
          python scripts/predict.py $D $F
          if [ -f docs/data/days/$D.json ]; then
            python scripts/predict.py $D --odds-only
            python scripts/results.py $D
          fi
      - name: 保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs data
          git diff --cached --quiet || (git commit -m "update $(TZ=Asia/Tokyo date +%m/%d\ %H:%M)" && git pull --rebase && git push)

name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q requests beautifulsoup4 lxml pandas numpy || true
      - run: python research/ana/collect_san_jra.py
      - uses: actions/upload-artifact@v4
        with: {name: san_jra, path: san_jra.jsonl.gz}

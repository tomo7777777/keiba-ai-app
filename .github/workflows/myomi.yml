name: 妙味軸の更新
on:
  schedule:
    # 日本時間 9:00〜21:45 の間 15分ごと（発走40分前に予想を固定）
    - cron: "0,15,30,45 0-12 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: myomi, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: 中央
        env: { TZ: Asia/Tokyo }
        run: python scripts/myomi_live.py jra || true
      - name: 地方
        env: { TZ: Asia/Tokyo, KEIBA_DATA: data/nar }
        run: python scripts/myomi_live.py nar || true
      - name: 保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs data
          git diff --cached --quiet && exit 0
          git commit -m "myomi $(TZ=Asia/Tokyo date +%m/%d\ %H:%M)"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && break; sleep 5; done
